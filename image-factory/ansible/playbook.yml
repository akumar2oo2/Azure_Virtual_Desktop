---
- name: Build Azure Virtual Desktop Golden Image
  hosts: all
  gather_facts: false

  vars:
    package_download_path: C:\Packages
    fslogix_zip_path: C:\Packages\FSLogix.zip
    fslogix_extract_path: C:\Packages\FSLogix
    ama_msi_path: C:\Packages\AzureMonitorAgent.msi

  tasks:
    - name: Ensure package download directory exists
      ansible.windows.win_file:
        path: "{{ package_download_path }}"
        state: directory

    - name: Install FSLogix
      ansible.builtin.include_tasks: roles/fslogix.yml

    - name: Apply Security Baseline
      ansible.builtin.include_tasks: roles/security-baseline.yml

    - name: Install Azure Monitor Agent
      ansible.builtin.include_tasks: roles/azure-monitor-agent.yml